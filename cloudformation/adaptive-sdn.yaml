AWSTemplateFormatVersion: '2010-09-09'
Description: 'Adaptive SDN lab: Ubuntu, Open vSwitch, OS-Ken OpenFlow 1.3 controller and 4 Linux namespaces.'
Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
    - t3.small
    - t3.medium
    - t3.large
    Description: Recommended t3.small or greater for OVS+controller.
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
Resources:
  LabVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value: sdn-lab-vpc
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId:
        Ref: InternetGateway
      VpcId:
        Ref: LabVPC
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: LabVPC
      CidrBlock: 10.60.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value: sdn-lab-host-subnet
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: LabVPC
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId:
        Ref: RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway
  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: RouteTable
      SubnetId:
        Ref: PublicSubnet
  LabSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access; SSM outbound managed only via EC2 IAM role.
      VpcId:
        Ref: LabVPC
      SecurityGroupEgress:
      - IpProtocol: '-1'
        CidrIp: 0.0.0.0/0
        Description: Outbound bootstrap packages and SSM
      Tags:
      - Key: Name
        Value: sdn-lab-no-inbound
  LabRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  LabProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - Ref: LabRole
  SDNInstance:
    Type: AWS::EC2::Instance
    DependsOn:
    - DefaultRoute
    - SubnetRouteAssoc
    Properties:
      ImageId:
        Ref: LatestUbuntuAmi
      InstanceType:
        Ref: InstanceType
      SubnetId:
        Ref: PublicSubnet
      SecurityGroupIds:
      - Ref: LabSG
      IamInstanceProfile:
        Ref: LabProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
      - DeviceName: /dev/sda1
        Ebs:
          VolumeSize: 16
          VolumeType: gp3
          DeleteOnTermination: true
          Encrypted: true
      UserData:
        Fn::Base64: "#!/bin/bash\nset -euxo pipefail\nexec > >(tee /var/log/sdn-bootstrap.log | logger -t user-data -s 2>/dev/console) 2>&1\nexport DEBIAN_FRONTEND=noninteractive\napt-get update\napt-get install -y openvswitch-switch python3 python3-venv python3-pip iproute2 iputils-ping curl\nmkdir -p /opt/sdn\nbase64 -d > /opt/sdn/adaptive_sdn.py <<'BASE64_ADAPTIVE_SDN'\\n\
          BASE64_ADAPTIVE_SDN\nbase64 -d > /opt/sdn/setup_topology.sh <<'BASE64_SETUP_TOPOLOGY'\\n\
          BASE64_SETUP_TOPOLOGY\nbase64 -d > /opt/sdn/run_tests.sh <<'BASE64_RUN_TESTS'\\n\
          BASE64_RUN_TESTS\nbase64 -d > /opt/sdn/verify_recovery.sh <<'BASE64_VERIFY_RECOVERY'\nIyEvdXNyL2Jpbi9lbnYgYmFzaApzZXQgLWV1byBwaXBlZmFpbApwcmludGYgJ1Rlc3RpbmcgUEMxIHRvIFBDMiBhZnRlciBxdWFyYW50aW5lIGV4cGlyeS4uLlxuJwppcCBuZXRucyBleGVjIHBjMSBwaW5nIC1jIDIgLVcgMiAxOTIuMTY4LjEwLjIKcHJpbnRmICdcbkFjdGl2ZSBPcGVuRmxvdyBmbG93czpcbicKb3ZzLW9mY3RsIC1PIE9wZW5GbG93MTMgZHVtcC1mbG93cyBici1zZG4K\nBASE64_VERIFY_RECOVERY\nchmod +x /opt/sdn/*.sh\npython3 -m venv /opt/sdn/venv\n/opt/sdn/venv/bin/pip install --disable-pip-version-check 'os-ken==4.2.2'\nsystemctl enable --now openvswitch-switch\ncat >/etc/systemd/system/sdn-controller.service <<'UNIT'\n[Unit]\nDescription=Adaptive SDN OpenFlow 1.3 controller (OS-Ken)\nAfter=network-online.target openvswitch-switch.service\nWants=network-online.target\nRequires=openvswitch-switch.service\n[Service]\nType=simple\nWorkingDirectory=/opt/sdn\nExecStart=/opt/sdn/venv/bin/osken-manager --ofp-listen-host 127.0.0.1 --ofp-tcp-listen-port 6653 --verbose /opt/sdn/adaptive_sdn.py\n\
          Restart=always\nRestartSec=3\nStandardOutput=journal\nStandardError=journal\n[Install]\nWantedBy=multi-user.target\nUNIT\nsystemctl daemon-reload\nsystemctl enable --now sdn-controller\n# systemd can report active before the controller socket is ready.\nfor i in $(seq 1 30); do\n  if bash -c 'echo >/dev/tcp/127.0.0.1/6653' 2>/dev/null; then break; fi\n  sleep 2\ndone\n/opt/sdn/setup_topology.sh\necho 'SDN_SETUP_COMPLETE' >/opt/sdn/installation-status\n"
      Tags:
      - Key: Name
        Value: adaptive-sdn-controller-ovs-lab
Outputs:
  InstanceId:
    Description: Open EC2 instance and connect using Session Manager.
    Value:
      Ref: SDNInstance
  VPC:
    Value:
      Ref: LabVPC
  AccessNote:
    Value: EC2 > Instances > Connect > Session Manager; then sudo /opt/sdn/run_tests.sh
